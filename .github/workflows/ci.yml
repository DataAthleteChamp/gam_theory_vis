name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # Spot-check the other platforms on one version rather than
          # paying for the full 3x3 grid.
          - python-version: "3.13"
            os: macos-latest
          - python-version: "3.13"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=term-missing

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --extra dev

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (format check)
        run: uv run ruff format --check --diff .

      - name: Mypy
        run: uv run mypy

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build sdist and wheel
        run: uv build

      - name: Verify the wheel installs and the CLI runs
        run: |
          uv venv /tmp/check
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl
          /tmp/check/bin/gtlab list
          /tmp/check/bin/gtlab solve prisoners_dilemma

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
