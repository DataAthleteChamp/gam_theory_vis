[project]
name = "gtlab"
version = "0.1.0"
description = "An interactive visualiser and simulator for game theory, built for a Game Theory in Electricity Markets course."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["game-theory", "nash-equilibrium", "education", "electricity-markets", "simulation"]

# Core stays PURE PYTHON so the whole app can run in a browser via Pyodide/WASM.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "nashpy>=0.0.41",
]

[project.optional-dependencies]
# Everything needed to run the interactive app locally.
app = [
    "marimo>=0.25.0",
    "matplotlib>=3.8",
]
# Iterated-game tournaments (pure python, browser safe).
tournaments = [
    "axelrod>=4.13",
]
# n-player and extensive-form solving. NOT browser safe: ships binary wheels
# and has no cp314 wheel, so it must stay optional.
advanced = [
    "pygambit>=16.1",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/DataAthleteChamp/gam_theory_vis"
Repository = "https://github.com/DataAthleteChamp/gam_theory_vis"
Issues = "https://github.com/DataAthleteChamp/gam_theory_vis/issues"
Demo = "https://DataAthleteChamp.github.io/gam_theory_vis/"

[project.scripts]
gtlab = "gtlab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",    # long lines are handled by the formatter
    "B008",    # marimo's UI element defaults are call-in-default by design
    "UP042",   # Convention is `(str, Enum)` on purpose: StrEnum changes what
               # `str(member)` returns, which would alter printed output
]

# `×` is intentional in rendered output ("Price of Anarchy 4.5×").
allowed-confusables = ["×", "−", "’"]

[tool.ruff.lint.per-file-ignores]
# marimo notebooks are a cell graph: each cell re-declares its imports and
# returns names for the next cell, which linters read as shadowing/unused.
"src/gtlab/app/app.py" = ["B018", "F841", "RUF005"]

[tool.mypy]
python_version = "3.11"
files = ["src/gtlab"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true

[[tool.mypy.overrides]]
# The app module is a marimo cell graph, not ordinary Python control flow.
module = "gtlab.app.app"
ignore_errors = true

[tool.coverage.run]
source = ["src/gtlab"]
omit = ["src/gtlab/app/app.py"]
